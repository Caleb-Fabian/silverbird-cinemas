kind = "web"
previewPath = "/"
title = "CineBook - Cinema Ticket Booking"
version = "1.0.0"
id = "artifacts/cinema-booking"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21745

[services.development]
run = "pnpm --filter @workspace/cinema-booking run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cinema-booking", "run", "build" ]
publicDir = "artifacts/cinema-booking/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21745"
BASE_PATH = "/"
